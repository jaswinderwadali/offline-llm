name: Android Release
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      OUTPUT: app/build/outputs/bundle/release/app-release.aab
      MAPPING: app/build/outputs/mapping/release/mapping.txt
      PACKAGE: ai.impact

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore signing keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
          cat > keystore.properties <<EOF
          storeFile=upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
        env:
          KEYSTORE_BASE64: '${{ secrets.KEYSTORE_BASE64 }}'
          KEYSTORE_PASSWORD: '${{ secrets.KEYSTORE_PASSWORD }}'
          KEY_ALIAS: '${{ secrets.KEY_ALIAS }}'
          KEY_PASSWORD: '${{ secrets.KEY_PASSWORD }}'

      - name: Build with Gradle
        run: ./gradlew :app:bundleRelease -PversionCode=${{ github.run_number }}

      - name: Upload aab
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            ${{ env.OUTPUT }}
            ${{ env.MAPPING }}

      - name: Create Google Play Config file
        run: |
          echo "$PLAY_CONFIG_JSON" | base64 -d > play_config.json
        env:
          PLAY_CONFIG_JSON: '${{ secrets.PLAY_CONFIG_JSON }}'

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJson: play_config.json
          packageName: ${{ env.PACKAGE }}
          releaseFiles: ${{ env.OUTPUT }}
          track: internal
          inAppUpdatePriority: 2
          mappingFile: ${{ env.MAPPING }}
          changesNotSentForReview: true

      - name: Clean up
        if: always()
        run: rm -f play_config.json upload.jks keystore.properties
